name: asd_nlp_screening_app
description: Flutter client for the ASD screening-support prototype.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # FastAPI NLP calls only; persistence and auth go through Supabase.
  http: ^1.2.0
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
